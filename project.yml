name: Cairn
options:
  bundleIdPrefix: com.florianmaisonnial
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 89SHJR3N3S
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Cairn:
    type: application
    platform: macOS
    sources:
      - path: Cairn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.florianmaisonnial.Cairn
        PRODUCT_NAME: Cairn
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # Pour la reprise du plan d'entraînement depuis un calendrier macOS.
        # En lecture seule : rien ici n'écrit jamais dans l'agenda.
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: >-
          Cairn lit votre calendrier d'entraînement pour reprendre les séances
          déjà planifiées. Il n'y écrit jamais.
        CODE_SIGN_ENTITLEMENTS: Cairn/Cairn.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  # L'outil en ligne de commande : la note du jour dans vim. Il rouvre le
  # store de l'application, donc il compile le modèle *entier* — un schéma
  # partiel passerait pour une migration, et SwiftData se mettrait à réécrire
  # la bibliothèque comme effet de bord de l'édition d'une note.
  cairn-note:
    type: tool
    platform: macOS
    sources:
      - path: CairnNote
      - path: Cairn/Model
        excludes:
          # La reprise du premier lancement, qui appelle `JournalImport` et
          # tirerait toute la lecture du dossier de notes derrière elle. Rien
          # ici n'en a besoin : l'outil écrit dans une base déjà reprise.
          - StoreMaintenance.swift
      - path: Cairn/Mirror/MirrorRow.swift
      - path: Cairn/Mirror/MirrorValue.swift
      # La seule conformité dont l'outil ait besoin : le journal. Le
      # magnétophone reconnaît une ligne par `as? any MirrorRow`, donc les
      # tables qu'il ne compile pas sont celles qu'il ne touche pas.
      - path: Cairn/Mirror/MirrorRows+Journal.swift
      - path: Cairn/Mirror/MirrorOutbox.swift
      - path: Cairn/Mirror/MirrorRecorder.swift
      # `Activity` et sa trace : la géométrie vient avec le modèle.
      - path: Cairn/Geo
      - path: Cairn/Features/Journal/JournalTag.swift
      - path: Cairn/Features/People/PersonHandle.swift
      - path: Cairn/Features/Journal/JournalNoteDate.swift
      - path: Cairn/Features/Journal/JournalNoteWrite.swift
    settings:
      base:
        PRODUCT_NAME: cairn-note
        # Signé localement et sans runtime durci : l'outil ne demande aucune
        # autorisation système, il n'ouvre qu'un fichier de l'utilisateur.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
  CairnTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes:
          - "Fixtures/**"
      - path: Tests/Fixtures
        type: group
        buildPhase: resources
    dependencies:
      - target: Cairn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.florianmaisonnial.CairnTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Cairn:
    build:
      targets:
        Cairn: all
        CairnTests: [test]
    # Release pour ce qu'on lance : `-Onone` coûte un facteur 1,6 sur le code
    # de l'application — mesuré le 31 août 2026 sur `PersonScanner` (0,45 s
    # contre 0,27 s) et sur `PeopleIndex.citations` (5,36 s contre 3,26 s) —
    # et ce code-là tourne à chaque rendu : la fusion des journées relit la
    # bibliothèque, l'index des gens relit tous les textes.
    #
    # Les essais restent en Debug, ils en ont besoin pour `@testable`.
    run:
      config: Release
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - CairnTests
  cairn-note:
    build:
      targets:
        cairn-note: all
