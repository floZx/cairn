name: Cairn
options:
  bundleIdPrefix: com.florianmaisonnial
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 89SHJR3N3S
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Cairn:
    type: application
    platform: macOS
    sources:
      - path: Cairn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.florianmaisonnial.Cairn
        PRODUCT_NAME: Cairn
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # Pour la reprise du plan d'entraînement depuis un calendrier macOS.
        # En lecture seule : rien ici n'écrit jamais dans l'agenda.
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: >-
          Cairn lit votre calendrier d'entraînement pour reprendre les séances
          déjà planifiées. Il n'y écrit jamais.
        CODE_SIGN_ENTITLEMENTS: Cairn/Cairn.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  CairnTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes:
          - "Fixtures/**"
      - path: Tests/Fixtures
        type: group
        buildPhase: resources
    dependencies:
      - target: Cairn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.florianmaisonnial.CairnTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Cairn:
    build:
      targets:
        Cairn: all
        CairnTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - CairnTests
