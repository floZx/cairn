<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mesure</title>
<style>
  :root { --fond:#000; --texte:#fff; --carte:#1c1c1e; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--fond); color:var(--texte);
         font:15px/1.4 -apple-system, system-ui, sans-serif; overflow:hidden }
  /* Le même châssis que l'application. */
  .chassis { position:fixed; inset:0; display:flex; flex-direction:column }
  .defilement { flex:1; overflow-y:auto; padding-top:calc(env(safe-area-inset-top) + 50px) }
  .contenu { padding:0 12px 72px }
  .carte { background:var(--carte); border-radius:16px; padding:14px; margin-bottom:16px }
  /* La même capsule, à la même place. */
  .onglets { position:absolute; left:12px; right:12px; bottom:6px; height:61px;
             border-radius:26px; background:#2c2c2eee; display:flex;
             align-items:center; justify-content:center; font-weight:600 }
  /* Des repères pour lire la géométrie sur une capture. */
  .repere { position:absolute; left:0; right:0; height:2px; background:#ff375f }
  .haut { top:env(safe-area-inset-top) }
  .bas { bottom:env(safe-area-inset-bottom) }
  b { color:#30d158 }
</style>
</head>
<body>
<div class="chassis">
  <div class="defilement"><div class="contenu">
    <div class="carte"><div id="sortie">…</div></div>
    <div class="carte">Dernière carte : son bas doit toucher la capsule.</div>
  </div></div>
  <div class="repere haut"></div>
  <div class="repere bas"></div>
  <div class="onglets">Capsule — bas : 6px</div>
</div>
<script>
const e = getComputedStyle(document.documentElement)
const probe = document.createElement('div')
probe.style.cssText = 'position:fixed;top:0;left:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);visibility:hidden'
document.body.appendChild(probe)
const cs = getComputedStyle(probe)
const o = document.querySelector('.onglets').getBoundingClientRect()
document.getElementById('sortie').innerHTML = `
  autonome : <b>${matchMedia('(display-mode: standalone)').matches || navigator.standalone ? 'oui' : 'non'}</b><br>
  écran : <b>${screen.width}×${screen.height}</b><br>
  fenêtre : <b>${innerWidth}×${innerHeight}</b><br>
  zone sûre haut : <b>${cs.paddingTop}</b><br>
  zone sûre bas : <b>${cs.paddingBottom}</b><br>
  capsule bas → bord : <b>${Math.round(innerHeight - o.bottom)} px</b><br>
  châssis haut : <b>${Math.round(document.querySelector('.chassis').getBoundingClientRect().top)}</b>,
  hauteur : <b>${Math.round(document.querySelector('.chassis').getBoundingClientRect().height)}</b>
`
</script>
</body>
</html>
